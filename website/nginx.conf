server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep Nginx's normal MIME map (especially text/html for the landing page)
    # and add the Android package type on top.  A standalone `types` block
    # replaces the complete default map and makes index.html download as a bin.
    include /etc/nginx/mime.types;
    types {
        application/vnd.android.package-archive apk;
    }

    location = /downloads/eventmonitor-voice-android-beta.apk {
        add_header Content-Disposition 'attachment; filename="eventmonitor-voice-android-beta.apk"' always;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
