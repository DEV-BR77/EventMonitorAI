name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
            tools/audio-lab/requirements.txt
      - run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
          pip install -r tools/audio-lab/requirements.txt
      - run: python scripts/check_project.py
      - run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      - run: python scripts/build_release.py --output dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventmonitorai:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/eventmonitorai:latest
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.json
