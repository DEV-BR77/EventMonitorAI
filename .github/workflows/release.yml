name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source archive
        run: |
          git archive --format=zip --output="EventMonitorAI-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "EventMonitorAI-${GITHUB_REF_NAME}.zip" > "EventMonitorAI-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            EventMonitorAI-${{ github.ref_name }}.zip
            EventMonitorAI-${{ github.ref_name }}.zip.sha256
