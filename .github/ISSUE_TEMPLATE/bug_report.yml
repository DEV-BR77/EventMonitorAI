name: Bug report
description: Reproduzierbaren Fehler melden
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktionsschritte
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version oder Commit
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Betriebssystem, Python, Gerät und relevante Komponenten
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine privaten Audio-, Datenbank- oder Zugangsdaten angehängt.
          required: true
